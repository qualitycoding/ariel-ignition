<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica,Arial,sans-serif" font-size="13">
<rect width="1000" height="700" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="bold">Ariel 350 electronic ignition - MAGBREAK (battery-less) variant</text>
<defs><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#222"/></marker></defs>
<rect x="30" y="60" width="400" height="150" rx="8" fill="#fdf3e7" stroke="#b86b00" stroke-width="2"/><text x="40" y="80" font-weight="bold">Retained Lucas magneto (points removed)</text><text x="40" y="100" font-size="12">armature: primary + secondary, condenser, slip ring</text><text x="40" y="117" font-size="12">HT pick-up and lead to the plug (original)</text><text x="40" y="134" font-size="12">cut-out terminal = primary live end P</text><text x="40" y="151" font-size="12">still drives the dynamo (magdyno)</text><rect x="560" y="60" width="400" height="110" rx="8" fill="#fbeaea" stroke="#a33" stroke-width="2"/><text x="570" y="80" font-weight="bold">Q2 electronic breaker (ignition IGBT)</text><text x="570" y="100" font-size="12">replaces the points: closed = primary shorted</text><text x="570" y="117" font-size="12">opens at the spark angle: magneto fires</text><text x="570" y="134" font-size="12">re-closes 60 deg later (magopen)</text><rect x="560" y="230" width="400" height="110" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/><text x="570" y="250" font-weight="bold">Harvest front end (chosen at gate G-003)</text><text x="570" y="270" font-size="12">HF-A: rectify the unused flux reversal</text><text x="570" y="287" font-size="12">HF-B: bridge + depletion-MOSFET isolator (PB2)</text><text x="570" y="304" font-size="12">reservoir -&gt; 5 V LDO -&gt; controller</text><rect x="30" y="240" width="200" height="60" rx="8" fill="#fbeaea" stroke="#a33" stroke-width="2"/><text x="40" y="260" font-weight="bold">Spark plug</text><text x="40" y="280" font-size="12">original HT lead + 5 kOhm cap</text><rect x="30" y="330" width="380" height="201" rx="8" fill="#eef4fb" stroke="#2a5d9f" stroke-width="2"/><text x="40" y="350" font-weight="bold">Controller (alloy box, ~90×40×30 mm)</text><text x="40" y="370" font-size="12">Arduino Pro Mini 5V/16MHz (ATmega328P @ 8 MHz)</text><text x="40" y="387" font-size="12">D8/PB0 ICP1 ← TRIG (4k7 pull-up, 1k + 1nF)</text><text x="40" y="404" font-size="12">D9/PB1 OC1A → gate network 220R / 470k / 10nF</text><text x="40" y="421" font-size="12">D2/PD2 ← KILL (10k pull-up, 1k + 100nF)</text><text x="40" y="438" font-size="12">D3/PD3 ← MAP switch (optional)</text><text x="40" y="455" font-size="12">A6 ← supply sense 68k / 4k7 (1.1 V ref)</text><text x="40" y="472" font-size="12">D0/D1 = tuning lead 38400 8N1; ISP 6-pin</text><text x="40" y="489" font-size="12">D10/PB2 → harvest isolate (HF-B only)</text><text x="40" y="506" font-size="12">Supply: harvest front end HF-A / HF-B (gate G-003)</text><rect x="560" y="400" width="280" height="132" rx="8" fill="#f3f0fa" stroke="#6a4c9c" stroke-width="2"/><text x="570" y="420" font-weight="bold">Trigger (in magneto breaker housing)</text><text x="570" y="440" font-size="12">Acetal disc on spindle (replaces points)</text><text x="570" y="457" font-size="12">SmCo magnet S-out @ lead 50° BTDC</text><text x="570" y="474" font-size="12">SmCo magnet N-out @ trail 0° (TDC)</text><text x="570" y="491" font-size="12">A1220LUA-T Hall latch, gap 1.0–1.5 mm</text><text x="570" y="508" font-size="12">(25° apart on the half-speed spindle)</text><rect x="560" y="560" width="400" height="80" rx="8" fill="#eef8ee" stroke="#2e7d32" stroke-width="2"/><text x="570" y="580" font-weight="bold">Rider controls</text><text x="570" y="600" font-size="12">SW2 cut-out button: shorts P to earth (hard kill)</text><text x="570" y="617" font-size="12">also sensed on PD2: firmware holds Q2 closed</text><polyline points="430,110 560,110" fill="none" stroke="#a33" stroke-width="2"/><text x="440" y="102" font-size="11" fill="#a33">P (cut-out terminal)</text><polyline points="495,110 495,285 560,285" fill="none" stroke="#a33" stroke-width="2"/><polyline points="410,380 520,380 520,150 560,150" fill="none" stroke="#2a5d9f" stroke-width="2"/><text x="440" y="373" font-size="11" fill="#2a5d9f">GATE</text><polyline points="560,320 540,320 540,430 410,430" fill="none" stroke="#b8860b" stroke-width="2"/><text x="440" y="423" font-size="11" fill="#b8860b">+5 V</text><polyline points="100,210 100,240" fill="none" stroke="#a33" stroke-width="2" stroke-dasharray="6,4"/><text x="106" y="230" font-size="11" fill="#a33">HT</text><polyline points="560,470 410,470" fill="none" stroke="#6a4c9c" stroke-width="2"/><text x="430" y="463" font-size="11" fill="#6a4c9c">TRIG (screened)</text><polyline points="560,610 300,610 300,531" fill="none" stroke="#2e7d32" stroke-width="2"/><text x="310" y="603" font-size="11" fill="#2e7d32">KILL sense</text><polyline points="960,600 985,600 985,40 495,40 495,110" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4"/><text x="900" y="34" font-size="11" fill="#2e7d32">SW2 to P</text>
<text x="20" y="686" font-size="11" fill="#555">Block wiring only — the netlist in hardware/WIRING.md is authoritative. Ariel 350 electronic ignition, qualitycoding/ariel-ignition.</text>
</svg>