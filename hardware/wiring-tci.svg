<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica,Arial,sans-serif" font-size="13">
<rect width="1000" height="700" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="bold">Ariel 350 electronic ignition — TCI (battery) variant</text>
<defs><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#222"/></marker></defs>
<rect x="30" y="60" width="190" height="90" rx="8" fill="#fdf3e7" stroke="#b86b00" stroke-width="2"/><text x="40" y="80" font-weight="bold">Battery 6 V (or 12 V)</text><text x="40" y="100" font-size="12">negative earth</text><text x="40" y="117" font-size="12">charged by dynamo/reg.</text><rect x="270" y="60" width="150" height="70" rx="8" fill="#fdf3e7" stroke="#b86b00" stroke-width="2"/><text x="280" y="80" font-weight="bold">SW1 main switch</text><text x="280" y="100" font-size="12">hard stop (power off)</text><rect x="460" y="60" width="110" height="70" rx="8" fill="#fdf3e7" stroke="#b86b00" stroke-width="2"/><text x="470" y="80" font-weight="bold">F1 5 A</text><text x="470" y="100" font-size="12">blade fuse</text><rect x="640" y="60" width="300" height="110" rx="8" fill="#fbeaea" stroke="#a33" stroke-width="2"/><text x="650" y="80" font-weight="bold">L1 ignition coil</text><text x="650" y="100" font-size="12">6 V: primary 1.2–1.8 Ω</text><text x="650" y="117" font-size="12">12 V: primary 2.8–3.5 Ω</text><text x="650" y="134" font-size="12">(+) ← IGN+    (−) → Q1 collector</text><rect x="700" y="230" width="240" height="110" rx="8" fill="#fbeaea" stroke="#a33" stroke-width="2"/><text x="710" y="250" font-weight="bold">Q1 ignition IGBT</text><text x="710" y="270" font-size="12">FGD3040G2-F085V / ISL9V3040</text><text x="710" y="287" font-size="12">400 V internal clamp, logic gate</text><text x="710" y="304" font-size="12">emitter → PGND star → frame</text><rect x="700" y="400" width="240" height="80" rx="8" fill="#fbeaea" stroke="#a33" stroke-width="2"/><text x="710" y="420" font-weight="bold">Spark plug</text><text x="710" y="440" font-size="12">copper HT lead + 5 kΩ cap</text><rect x="250" y="230" width="380" height="184" rx="8" fill="#eef4fb" stroke="#2a5d9f" stroke-width="2"/><text x="260" y="250" font-weight="bold">Controller (alloy box, ~90×40×30 mm)</text><text x="260" y="270" font-size="12">Arduino Pro Mini 5V/16MHz (ATmega328P @ 8 MHz)</text><text x="260" y="287" font-size="12">D8/PB0 ICP1 ← TRIG (4k7 pull-up, 1k + 1nF)</text><text x="260" y="304" font-size="12">D9/PB1 OC1A → gate network 220R / 470k / 10nF</text><text x="260" y="321" font-size="12">D2/PD2 ← KILL (10k pull-up, 1k + 100nF)</text><text x="260" y="338" font-size="12">D3/PD3 ← MAP switch (optional)</text><text x="260" y="355" font-size="12">A6 ← supply sense 68k / 4k7 (1.1 V ref)</text><text x="260" y="372" font-size="12">D0/D1 = tuning lead 38400 8N1; ISP 6-pin</text><text x="260" y="389" font-size="12">U1 LM2936-5.0 + SS14 + 10R + SMBJ20A + 100µF</text><rect x="30" y="470" width="280" height="132" rx="8" fill="#f3f0fa" stroke="#6a4c9c" stroke-width="2"/><text x="40" y="490" font-weight="bold">Trigger (in magneto breaker housing)</text><text x="40" y="510" font-size="12">Acetal disc on spindle (replaces points)</text><text x="40" y="527" font-size="12">SmCo magnet S-out @ lead 50° BTDC</text><text x="40" y="544" font-size="12">SmCo magnet N-out @ trail 0° (TDC)</text><text x="40" y="561" font-size="12">A1220LUA-T Hall latch, gap 1.0–1.5 mm</text><text x="40" y="578" font-size="12">(25° apart on the half-speed spindle)</text><rect x="360" y="520" width="300" height="100" rx="8" fill="#eef8ee" stroke="#2e7d32" stroke-width="2"/><text x="370" y="540" font-weight="bold">Rider controls</text><text x="370" y="560" font-size="12">SW2 handlebar STOP button (N/O) → KILL</text><text x="370" y="577" font-size="12">SW3 map toggle (optional) → MAP</text><text x="370" y="594" font-size="12">Tuning lead (FTDI 5 V) → J2</text><polyline points="220,95 270,95" fill="none" stroke="#b86b00" stroke-width="2"/><polyline points="420,95 460,95" fill="none" stroke="#b86b00" stroke-width="2"/><polyline points="570,95 640,95" fill="none" stroke="#b86b00" stroke-width="2"/><text x="590" y="88" font-size="11" fill="#b86b00">IGN+</text><polyline points="600,95 600,200 440,200 440,230" fill="none" stroke="#b86b00" stroke-width="2"/><text x="452" y="196" font-size="11" fill="#b86b00">IGN+ → supply &amp; sense</text><polyline points="805,170 805,230" fill="none" stroke="#a33" stroke-width="2"/><text x="812" y="205" font-size="11" fill="#a33">coil −</text><polyline points="630,300 700,300" fill="none" stroke="#2a5d9f" stroke-width="2"/><text x="640" y="293" font-size="11" fill="#2a5d9f">GATE</text><polyline points="940,120 975,120 975,440 940,440" fill="none" stroke="#a33" stroke-width="2"/><text x="979" y="300" font-size="11" fill="#a33">HT</text><polyline points="820,340 820,365" fill="none" stroke="#222" stroke-width="2"/><line x1="820" y1="365" x2="820" y2="375" stroke="#222" stroke-width="2"/><line x1="808" y1="375" x2="832" y2="375" stroke="#222" stroke-width="2"/><line x1="813" y1="380" x2="827" y2="380" stroke="#222" stroke-width="2"/><line x1="817" y1="385" x2="823" y2="385" stroke="#222" stroke-width="2"/><polyline points="310,480 310,420" fill="none" stroke="#6a4c9c" stroke-width="2"/><text x="318" y="460" font-size="11" fill="#6a4c9c">TRIG / +5V / GND (screened)</text><polyline points="500,520 500,420" fill="none" stroke="#2e7d32" stroke-width="2"/><text x="508" y="470" font-size="11" fill="#2e7d32">KILL / MAP</text><polyline points="60,150 60,200" fill="none" stroke="#222" stroke-width="2"/><line x1="60" y1="200" x2="60" y2="210" stroke="#222" stroke-width="2"/><line x1="48" y1="210" x2="72" y2="210" stroke="#222" stroke-width="2"/><line x1="53" y1="215" x2="67" y2="215" stroke="#222" stroke-width="2"/><line x1="57" y1="220" x2="63" y2="220" stroke="#222" stroke-width="2"/>
<text x="20" y="686" font-size="11" fill="#555">Block wiring only — the netlist in hardware/WIRING.md is authoritative. Ariel 350 electronic ignition, qualitycoding/ariel-ignition.</text>
</svg>